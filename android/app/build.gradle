plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id 'com.google.firebase.crashlytics'
}

// Machine-local settings (not committed): android/local.properties.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withReader("UTF-8") { localProps.load(it) }
}

// Google Maps key: -PMAPS_API_KEY=..., env MAPS_API_KEY (CI secret), or
// MAPS_API_KEY=... in android/local.properties. Never commit it.
def mapsApiKey = project.findProperty("MAPS_API_KEY") ?:
        System.getenv("MAPS_API_KEY") ?:
        localProps.getProperty("MAPS_API_KEY") ?:
        ""

// Load signing credentials from key.properties (not committed to git).
def keystorePropsFile = rootProject.file("key.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// A production build must be signed with the real upload key. Without this
// check it silently fell back to the debug key, producing a bundle Google
// Play rejects (or, worse, publishing under the wrong key).
gradle.taskGraph.whenReady {
    // Look at what was asked for (flutter build ... --flavor prod requests
    // assembleProdRelease / bundleProdRelease); dev builds also pull in some
    // prod helper tasks, so the task graph itself can't be used.
    def requested = gradle.startParameter.taskNames*.toLowerCase()
    def buildsProdRelease = requested.any { it.contains("prodrelease") }
    if (buildsProdRelease && !keystorePropsFile.exists()) {
        throw new GradleException(
            "Release signing key missing. Create android/key.properties " +
            "(see android/key.properties.example) before building the prod release.")
    }
}

android {
    namespace "com.smartagro.connect"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile     file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias      keystoreProps['keyAlias']
                keyPassword   keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.smartagro.connect"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName

        manifestPlaceholders += [
                MAPS_API_KEY: mapsApiKey
        ]
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            // Use release keystore when available, fall back to debug for local builds.
            signingConfig keystorePropsFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    flavorDimensions "environment"

    productFlavors {
        dev {
            dimension "environment"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "SmartAgro Dev"
        }
        staging {
            dimension "environment"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "SmartAgro Staging"
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "SmartAgro Connect"
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // Theme.AppCompat for the launch theme, required by local_auth's
    // fingerprint dialog on older Android versions.
    implementation "androidx.appcompat:appcompat:1.7.0"
}
