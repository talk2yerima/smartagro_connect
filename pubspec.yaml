name: smartagro_connect
description: SmartAgro Connect — production-ready African agricultural marketplace (Flutter).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  equatable: ^2.0.7
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  google_maps_flutter: ^2.9.0
  flutter_animate: ^4.5.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0

  # ── Firebase ──────────────────────────────────────────────────────────────
  # Run `flutterfire configure` to generate lib/firebase_options.dart, then
  # add google-services.json (Android) and GoogleService-Info.plist (iOS).
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4
  firebase_crashlytics: ^4.1.0
  firebase_analytics: ^11.3.0
  google_sign_in: ^6.2.1

  # ── Security ──────────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  # Windows builds fall back to SharedPreferences in SecureTokenStore —
  # see lib/data/services/secure_token_store.dart for the platform guard.

  # ── Networking ───────────────────────────────────────────────────────────

  # ── Image caching / compression ───────────────────────────────────────────
  flutter_image_compress: ^2.3.0

  # ── Observability ────────────────────────────────────────────────────────
  logger: ^2.4.0

  # ── Payments ─────────────────────────────────────────────────────────────────
  url_launcher: ^6.3.1

  # ── Security ─────────────────────────────────────────────────────────────────
  safe_device: ^1.2.1
  local_auth: ^3.0.2
  record: ^6.2.1
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mock/
    # Bundled so text never waits for (or spends data on) a font download.
    # File names match google_fonts' lookup (e.g. Poppins-SemiBold.ttf).
    - assets/fonts/

  # Lets plain `fontFamily: 'Poppins'` / 'Inter' styles resolve to the
  # bundled files instead of silently falling back to Roboto.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
